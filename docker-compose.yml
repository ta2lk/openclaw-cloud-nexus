version: '3.8'
services:
  openclaw:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ACTIVE_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve

volumes:
  ollama_data:
